<div class="inarea">
  <div class="inrow">
    <div class="inbox">
      <textarea id="inp" placeholder="Speak from the heart... Niambie chochote 💙" rows="1" onkeydown="onKey(event)" oninput="resize(this)"></textarea>

<script>
// Fatuma — Pure Friend & Counsellor (Fully PWA Ready)
const BACKEND = 'https://fatuma-backend.onrender.com';

let hist = [], loading = false;

function eatNow() {
  const d = new Date(Date.now() + 3*3600000);
  return String(d.getUTCHours()).padStart(2,'0') + ':' + String(d.getUTCMinutes()).padStart(2,'0') + ' EAT';
}

function buildSystem() {
  return `You are Fatuma, a warm Kenyan woman from Nairobi. You are a real friend and counsellor.
Today is ${eatNow()}. Speak naturally in English or Kiswahili.
Be empathetic, validating, and supportive. Never robotic.
You can talk about anything, but your purpose is to be a safe, caring presence.`;
}

function resize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function onKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMsg();
  }
}

function addMessage(role, text) {
  const msgs = document.getElementById('msgs');
  const div = document.createElement('div');
  div.className = `mrow ${role}`;
  div.innerHTML = role === 'bot' ? 
    `<div class="mava ba"><img src="data:image/jpeg;base64,..."></div><div class="bubble"><div class="content">${text.replace(/\n/g,'<br>')}</div><div class="msg-meta">${eatNow()}</div></div>` :
    `<div class="bubble user"><div class="content">${text}</div><div class="msg-meta">${eatNow()} ✓✓</div></div>`;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function showTyping() {
  const id = 'typing' + Date.now();
  const msgs = document.getElementById('msgs');
  msgs.innerHTML += `<div id="${id}" class="trow"><div class="mava ba"><img src="data:image/jpeg;base64,..."></div><div class="tbub">...</div></div>`;
  msgs.scrollTop = msgs.scrollHeight;
  return id;
}

async function sendMsg() {
  if (loading) return;
  const inp = document.getElementById('inp');
  const text = inp.value.trim();
  if (!text) return;

  addMessage('user', text);
  hist.push({role: 'user', content: text});
  inp.value = '';

  loading = true;
  const tid = showTyping();

  try {
    const res = await fetch(`${BACKEND}/api/chat`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        model: 'llama-3.3-70b-versatile',
        max_tokens: 950,
        system: buildSystem(),
        messages: hist.slice(-15)
      })
    });
    const data = await res.json();
    const reply = data.content || "Pole, niko hapa lakini kuna tatizo kidogo. Jaribu tena.";
    hist.push({role: 'assistant', content: reply});
    addMessage('bot', reply);
  } catch(e) {
    addMessage('bot', "Samahani, connection ina shida. Jaribu tena baadaye.");
  }

  document.getElementById(tid)?.remove();
  loading = false;
}

function manualRefresh() {
  hist = [];
  document.getElementById('msgs').innerHTML = `
    <div class="intro">
      <h2>Karibu 💙</h2>
      <p>Niko Fatuma, rafiki yako wa kweli. Unaweza niambia chochote unachohisi.</p>
      <p>Niko hapa nawe, kila wakati.</p>
    </div>`;
}

// Init
window.onload = () => {
  manualRefresh();
};
</script>
</body>
</html>
